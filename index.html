<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project Horizon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;600;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
/* ===== THEME: change these to match the deck ===== */
:root{
  --bg:#0a2540;        /* page ground (navy) */
  --panel:#10305a;     /* cards */
  --panel2:#163a6b;    /* raised / hover */
  --line:#24508a;      /* borders */
  --ink:#ffffff;       /* main text */
  --mute:#a9c1de;      /* secondary text */
  --sky:#8fd3ff;       /* data / accent */
  --good:#5be3a6;      /* positive deltas */
  --danger:#ff5c8a;    /* fired risk, crash */
  --font:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--font);overflow-x:clip}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding:14px max(3vw,16px);border-bottom:1px solid var(--line)}
header h1{font-size:20px;margin:0;font-weight:800;letter-spacing:-.01em}
header .sub{color:var(--mute);font-size:14px}
.demo{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 16px;min-height:44px}
.btn:hover{border-color:var(--sky)}
.btn.primary{background:var(--sky);color:#06203a;border-color:var(--sky);font-weight:800}
.btn.small{min-height:36px;padding:6px 12px;font-size:14px}
.wrap{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:20px;padding:20px max(3vw,16px);max-width:1400px;margin:0 auto}
@media(max-width:900px){.wrap{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:clamp(16px,2.4vw,28px)}
.label{color:var(--mute);font-size:13px}
h2{font-size:clamp(26px,3.4vw,40px);line-height:1.08;margin:6px 0 12px;text-wrap:balance;font-weight:800;letter-spacing:-.015em}
h3{font-size:18px;margin:0 0 8px}
p{margin:0 0 12px;max-width:70ch}
.meters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:16px}
@media(max-width:560px){.meters{grid-template-columns:minmax(0,1fr)}}
.meter{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
.meter .v{font-size:clamp(26px,3vw,34px);font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}
.bar{height:10px;border-radius:6px;background:#0a2540;overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;background:var(--sky);transition:width .6s}
.bar.risk>i{background:linear-gradient(90deg,#ffb3c7,var(--danger))}
.up{color:var(--good)}.down{color:var(--danger)}
.timer{display:flex;align-items:center;gap:12px;margin:4px 0 16px}
.timer .bar{flex:1;margin:0}
.timer b{font-size:22px;width:3ch;text-align:right;font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-size:13px;color:var(--sky);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.memo{border-left:3px solid var(--danger);background:#0c2a4d;padding:10px 14px;border-radius:0 10px 10px 0;margin:14px 0 18px}
.memo .from{font-size:13px;color:var(--mute)}
.shock{background:#3a1430;border:1px solid var(--danger);border-radius:10px;padding:10px 14px;margin-bottom:12px}
.opts{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:44px minmax(0,1fr);gap:14px;align-items:center;text-align:left;background:var(--panel2);border:2px solid var(--line);border-radius:14px;padding:14px 16px;min-height:64px}
.opt:hover{border-color:var(--sky);transform:translateY(-1px)}
.opt .k{display:grid;place-items:center;width:40px;height:40px;border-radius:10px;background:var(--sky);color:#06203a;font-weight:800;font-size:20px}
.opt strong{display:block;font-size:17px}
.opt span{color:var(--mute);font-size:14px}
.locked{text-align:center;padding:30px 10px}
.locked .big{font-size:22px;font-weight:800}
table{width:100%;border-collapse:collapse}
td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;font-size:15px}
th{color:var(--mute);font-weight:400;font-size:13px}
td.n,th.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.side h3{display:flex;justify-content:space-between;align-items:baseline}
.count{font-size:clamp(40px,5vw,64px);font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.row-you td{color:var(--sky);font-weight:600}
.out td{color:var(--mute)}.out td:nth-child(2),.out td:nth-child(3){text-decoration:line-through}
.chip{font-size:12px;border-radius:6px;padding:2px 7px;background:#0a2540;border:1px solid var(--line);white-space:nowrap}
.chip.ok{color:var(--good);border-color:var(--good)}
.chip.fired{color:var(--danger);border-color:var(--danger)}
.ending-letter{font-size:clamp(72px,10vw,120px);font-weight:800;line-height:1;color:var(--sky)}
.ending-letter.bad{color:var(--danger)}
.link{background:#0c2a4d;border-radius:12px;padding:12px 16px;margin:14px 0}
.reveal .bar{height:18px}
.reveal .bar>i{transition:width 2.2s cubic-bezier(.2,.8,.2,1);background:linear-gradient(90deg,var(--good),#ffd166 45%,var(--danger) 70%)}
.fig{position:relative;min-height:360px;margin:8px 0 16px}
.fig>svg{position:absolute;inset:0;width:100%;height:100%}
.prompts li{margin-bottom:10px;font-size:18px}
input[type=text]{font:inherit;font-size:18px;background:#0a2540;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-height:44px;width:min(320px,100%)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:16px 0}
.mini{background:var(--panel2);border-radius:12px;padding:12px 14px;font-size:15px}
.note{font-size:13px;color:var(--mute)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

.narrow{max-width:760px;margin:0 auto}
.conn{font-size:13px;border-radius:999px;padding:4px 10px;border:1px solid var(--line)}
.conn.ok{color:var(--good);border-color:var(--good)}.conn.bad{color:var(--danger);border-color:var(--danger)}
#controls{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.btn.ghost{background:transparent;color:var(--mute)}
.wrap1{padding:20px max(3vw,16px);max-width:1500px;margin:0 auto}
.opt.sel{border-color:var(--sky)}
.opts.static .opt{cursor:default}.opts.static .opt:hover{transform:none;border-color:var(--line)}
form input{display:block;margin-top:4px}
.hostgrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px}
@media(max-width:900px){.hostgrid{grid-template-columns:minmax(0,1fr)}}
body.host{font-size:19px}
body.host .big{font-size:clamp(20px,1.6vw,26px)}
body.host h2.huge{font-size:clamp(34px,3.6vw,56px)}
body.host .lb td{font-size:clamp(16px,1.3vw,22px);padding:10px 6px}
.small{font-size:.8em}.sky{color:var(--sky)}
.code{font-size:1.6em;letter-spacing:.06em;color:var(--sky)}
.qr{display:grid;place-items:center;background:#fff}
.qr svg{width:100%;max-width:420px;height:auto}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.gchip{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:8px 8px 8px 16px;font-size:18px;display:inline-flex;align-items:center;gap:6px}
.x{background:none;border:0;color:var(--mute);font-size:20px;width:32px;height:32px;border-radius:50%}
.x:hover{color:var(--danger)}
td.boeing,span.boeing{color:var(--danger);font-weight:800}
.count{font-size:clamp(56px,7vw,110px);font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
</style>
</head>

      },
      boeing: { choice: "street", fact: "Boeing returned about $60.5B to shareholders through buybacks and dividends while cutting R&D and supplier budgets." } },

    { part: "Strategy", title: "Airbus strikes",

      memo: { from: "CFO", text: "A clean sheet means a decade of capex and no answer to Airbus. The Street will punish us." },
      options: {
        street:   { label: "Re-engine the 737 now", detail: "Bigger engines on an old airframe. Handling quirks get fixed in software.", stock: 12, fired: 0, safety: 15 },

        engineer: { label: "Design a new aircraft", detail: "The right plane, a decade away. Airbus wins the next orders.", stock: -10, fired: 15, safety: 0 }
      },
      boeing: { choice: "street", fact: "In 2011 Boeing re-engined the 737 (the MAX) instead of designing a new plane. The larger engines changed its handling, which MCAS was built to mask." } },

    { part: "Strategy & Culture", title: "More for less",
      scenario: "Margins lag Airbus. Consultants propose: rank every employee and cut the bottom 10%, demand 15% price cuts from suppliers, and replace “Boeing family” with “team”.",
      memo: { from: "COO", text: "Families protect their weakest members. Teams cut them." },
      options: {
        street:   { label: "Run the full program", detail: "Rank-and-yank, supplier squeeze, new language.", stock: 10, fired: 0, safety: 10 },
        middle:   { label: "Hiring freeze only", detail: "Save money quietly. No layoffs.", stock: 4, fired: 0, safety: 4 },

      },
      boeing: { choice: "street", fact: "Under “more for less”, Boeing ranked and cut staff, pressed suppliers for steep price cuts, and replaced “family” with “team”." } },

    { part: "Collapse", title: "One sensor or two",

        title: "Crash in the Java Sea",
        scenario: "One of your new aircraft crashes minutes after take-off. 189 people are dead. Early data points to the flight-control software, and to the pilots."

      text: "One sensor, no simulator training. When the software fired, pilots had seconds to diagnose a system nobody had told them about.",

      text: "No crash yet. The risks are still in the system.",

    "Nobody in this room was a bad apple. So who made these decisions?",
    "What would have to change (incentives, the freedom to speak up, oversight) for the safe choice to be the rational one?"
  ]
};

{
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

  let data = read(); const subs = new Set();
  const parts = p => p.split("/").filter(Boolean);
  const getP = p => { let o = data; for (const k of parts(p)) { if (o == null) return null; o = o[k]; } return o === undefined ? null : clean(o); };
  const setP = (p, v) => { const ks = parts(p); let o = data; for (let i = 0; i < ks.length - 1; i++) { if (typeof o[ks[i]] !== "object" || o[ks[i]] === null) o[ks[i]] = {}; o = o[ks[i]]; } const k = ks[ks.length - 1]; if (v === null || v === undefined) delete o[k]; else o[k] = clean(v); };
  const emit = () => subs.forEach(s => s.cb(getP(s.p)));
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch {} if (ch) ch.postMessage(1); emit(); };
  if (ch) ch.onmessage = () => { data = read(); emit(); };
  setTimeout(() => onConn(true));
  return { mode: "demo", now: () => Date.now(),
    set: async (p, v) => { setP(p, v); save(); },
    update: async (p, o) => { for (const k in o) setP(p + "/" + k, o[k]); save(); },
    on: (p, cb) => { const s = { p, cb }; subs.add(s); setTimeout(() => cb(getP(p))); return () => subs.delete(s); } };
}

/* ---------------- shared game logic ---------------- */
function team(id, raw) {
  const t = Object.assign({ id, stock: CONFIG.start.stock, fired: CONFIG.start.fired, safety: CONFIG.start.safety, out: false, crashed: false, outRound: null }, raw || {});
  t.flags = new Set(Object.keys((raw && raw.flags) || {}));
  t.choices = Object.assign({}, (raw && raw.choices) || {});
  return t;
}
function serialize(t) {
  return { name: t.name, joined: t.joined || 0, stock: t.stock, fired: t.fired, safety: t.safety,
    flags: Object.fromEntries([...t.flags].map(f => [f, true])), choices: t.choices,
    out: !!t.out, outRound: t.outRound ?? null, crashed: !!t.crashed, last: t.last || null, ending: t.ending || null };
}
const teamsOf = ses => Object.entries((ses && ses.teams) || {}).map(([id, r]) => team(id, r)).sort((a, b) => (a.joined || 0) - (b.joined || 0));
const picksFor = (ses, r) => (ses && ses.picks && ses.picks[r]) || {};

function applyRound(t, r, pick) {
  const timedOut = !KEYS.includes(pick);
  const k = timedOut ? CONFIG.timeoutDefault : pick;
  const o = CONFIG.rounds[r].options[k];
  const s0 = t.stock, f0 = t.fired;
  t.stock = Math.max(1, t.stock + o.stock);
  t.fired += o.fired; t.safety += o.safety;
  (o.flags || []).forEach(f => t.flags.add(f));
  t.choices[r] = k;
  const gap = target(r) - t.stock;
  t.fired += gap > 0 ? Math.min(P.firedGapCap, gap * P.firedPerDollarGap) : -P.beatTargetRelief;
  t.fired = Math.max(0, Math.min(100, t.fired));
  if (t.fired >= P.firedLimit) { t.out = true; t.outRound = r; }
  t.last = { r, dStock: t.stock - s0, dFired: t.fired - f0, timedOut, pick: k };
}

/* ---------------- state ---------------- */
let B, SES, SP, CODE, unsub = null;
let pendingName = null, joinError = "";
const store = LIVE ? localStorage : sessionStorage;   // demo: one team per tab
const tidKey = c => "horizon-team-" + c;
const myId = () => { try { return store.getItem(tidKey(CODE)); } catch { return null; } };
const setMyId = v => { try { v ? store.setItem(tidKey(CODE), v) : store.removeItem(tidKey(CODE)); } catch {} };

function subscribe(code) {
  CODE = code.toUpperCase(); SP = "sessions/" + CODE; SES = undefined;
  if (unsub) unsub();
  unsub = B.on(SP, v => { SES = v; onSession(); });
}

function onSession() {
  if (IS_HOST) { if (SES === null) hostCreate(); render(); return; }
  const id = myId(), st = SES && SES.state;
  if (SES && id && !(SES.teams && SES.teams[id])) setMyId(null);
  if (SES && st && pendingName && !myId()) {
    if (st.phase === "lobby") {
      const nid = Math.random().toString(36).slice(2, 10);
      setMyId(nid);
      B.set(`${SP}/teams/${nid}`, { name: pendingName, joined: B.now() });
      pendingName = null;
    } else { joinError = "started"; pendingName = null; }
  }
  if (SES === null && pendingName) { joinError = "nosession"; pendingName = null; }
  render();
}

/* ---------------- host actions ---------------- */
let resolving = null;
async function hostCreate() { resolving = null; await B.set(SP, { state: { phase: "lobby", createdAt: B.now() } }); }
async function hostStartGame() {
  const ts = teamsOf(SES).map(t => team(t.id, { name: t.name, joined: t.joined }));
  if (!ts.length) return;
  const up = { picks: null };
  ts.forEach(t => up["teams/" + t.id] = serialize(t));
  await B.update(SP, up);
  await hostStartRound(0, ts);
}
async function hostStartRound(r, tsArg) {
  const ts = tsArg || teamsOf(SES), rd = CONFIG.rounds[r], sh = CONFIG.shocks[r + 1] || null, up = {};
  ts.filter(t => !t.out).forEach(t => {
    if (sh) t.stock = Math.max(1, t.stock + sh.stock);
    t.crashed = t.crashed || !!(rd.variant && rd.variant.when(t));
    up["teams/" + t.id] = serialize(t);
  });
  up.state = { phase: "round", r, endsAt: B.now() + CONFIG.roundSeconds * 1000, pausedLeft: null,
    order: CONFIG.shuffleOptions ? shuffle(KEYS.slice()) : KEYS.slice(), shock: sh };
  await B.update(SP, up);
}
async function hostResolve() {
  const r = SES.state.r; if (resolving === r) return; resolving = r;
  const picks = picksFor(SES, r), up = {};
  teamsOf(SES).filter(t => !t.out).forEach(t => { applyRound(t, r, picks[t.id]); up["teams/" + t.id] = serialize(t); });
  up["state/phase"] = "result"; up["state/endsAt"] = null; up["state/pausedLeft"] = null;
  await B.update(SP, up);
}
async function hostReveal() {
  const up = {};
  teamsOf(SES).forEach(t => { t.ending = CONFIG.endings.find(e => e.when(t)).letter; up["teams/" + t.id] = serialize(t); });
  up["state/phase"] = "ending";
  await B.update(SP, up);
}
const hostPhase = p => B.update(SP, { "state/phase": p });
function hostPause() {
  const st = SES.state;
  if (st.pausedLeft != null) B.update(SP, { "state/endsAt": B.now() + st.pausedLeft, "state/pausedLeft": null });
  else B.update(SP, { "state/pausedLeft": Math.max(0, st.endsAt - B.now()), "state/endsAt": null });
}
function hostAdd(ms) {
  const st = SES.state;
  if (st.pausedLeft != null) B.update(SP, { "state/pausedLeft": st.pausedLeft + ms });
  else B.update(SP, { "state/endsAt": st.endsAt + ms });
}
setInterval(() => {
  if (!B || !SES || !SES.state) return;
  const st = SES.state;
  if (IS_HOST && st.phase === "round" && st.pausedLeft == null && resolving !== st.r) {
    const act = teamsOf(SES).filter(t => !t.out), pk = picksFor(SES, st.r);
    if (B.now() >= st.endsAt || (act.length && act.every(t => pk[t.id]))) hostResolve();
  }
  tickTimers();
}, 250);

function secsLeft() {
  const st = SES && SES.state; if (!st) return 0;
  const ms = st.pausedLeft != null ? st.pausedLeft : (st.endsAt || 0) - B.now();
  return Math.max(0, ms);
}
function tickTimers() {
  if (!SES || !SES.state || SES.state.phase !== "round") return;
  const ms = secsLeft(), f = ms / (CONFIG.roundSeconds * 1000);
  document.querySelectorAll(".tbar").forEach(b => { b.style.width = Math.min(100, f * 100) + "%"; b.style.background = f < 0.25 ? "var(--danger)" : ""; });
  document.querySelectorAll(".tnum").forEach(n => n.textContent = Math.ceil(ms / 1000) + (SES.state.pausedLeft != null ? " ⏸" : ""));
}

const timerRow = () => `<div class="timer"><div class="bar"><i class="tbar" style="width:100%"></i></div><b class="tnum">${CONFIG.roundSeconds}</b></div>`;
const optList = (rd, order, chosen) => order.map((k, i) => { const o = rd.options[k];
  return `<button class="opt ${chosen === k ? "sel" : ""}" data-k="${k}"><span class="k">${"ABC"[i]}</span><span><strong>${esc(o.label)}</strong><span>${esc(o.detail)}</span></span></button>`; }).join("");

function scatterSvg(ts) {
  const W = 900, H = 420, m = { l: 60, r: 24, t: 16, b: 46 };
  const xs = ts.map(t => t.stock), xmin = Math.min(...xs, 80) - 10, xmax = Math.max(...xs, 140) + 10;
  const ymin = Math.min(-20, ...ts.map(t => t.safety)), ymax = Math.max(130, ...ts.map(t => t.safety));
  const X = v => m.l + (v - xmin) / (xmax - xmin) * (W - m.l - m.r), Y = v => H - m.b - (v - ymin) / (ymax - ymin) * (H - m.t - m.b);
  let g = `<rect x="${m.l}" y="${Y(ymax)}" width="${W - m.l - m.r}" height="${Y(CONFIG.crashLine) - Y(ymax)}" fill="rgba(255,92,138,.12)"/>
    <line x1="${m.l}" x2="${W - m.r}" y1="${Y(CONFIG.crashLine)}" y2="${Y(CONFIG.crashLine)}" stroke="#ff5c8a" stroke-dasharray="6 6"/>
    <text x="${W - m.r - 6}" y="${Y(CONFIG.crashLine) - 8}" fill="#ff5c8a" font-size="16" text-anchor="end">Crash zone</text>
    <line x1="${m.l}" x2="${W - m.r}" y1="${H - m.b}" y2="${H - m.b}" stroke="#24508a"/><line x1="${m.l}" x2="${m.l}" y1="${m.t}" y2="${H - m.b}" stroke="#24508a"/>
    <text x="${(W + m.l) / 2}" y="${H - 8}" fill="#a9c1de" font-size="16" text-anchor="middle">Final stock price (what everyone saw)</text>
    <text transform="translate(18 ${(H - m.b + m.t) / 2}) rotate(-90)" fill="#a9c1de" font-size="16" text-anchor="middle">Safety debt (hidden)</text>`;
  for (let v = Math.ceil(xmin / 20) * 20; v <= xmax; v += 20) g += `<text x="${X(v)}" y="${H - m.b + 20}" fill="#a9c1de" font-size="14" text-anchor="middle">$${v}</text>`;
  ts.forEach((t, i) => { const cx = X(t.stock), cy = Y(t.safety), left = cx > W - 200, c = t.safety >= CONFIG.crashLine ? "#ff5c8a" : "#8fd3ff";
    g += `<circle cx="${cx}" cy="${cy}" r="10" fill="${c}" stroke="#0a2540" stroke-width="2"/>
      ${ts.length > CONFIG.scatterLabelMax ? "" : `<text x="${cx + (left ? -16 : 16)}" y="${cy + 5 + (i % 2 ? 14 : 0)}" fill="#fff" font-size="16" text-anchor="${left ? "end" : "start"}">${esc(t.name)} · ${esc(t.ending || "")}</text>`}`; });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Stock price against hidden safety debt per player" style="width:100%;height:auto;max-height:46vh">${g}</svg>`;
}

      <div class="memo"><div class="from">Memo from the ${esc(rd.memo.from)}</div>“${esc(rd.memo.text)}”</div>
      <div class="opts static">${optList(rd, st.order)}</div></div>
    <div class="card"><div class="count"><span class="tnum">${CONFIG.roundSeconds}</span></div>
      <div class="bar" style="margin:8px 0 6px"><i class="tbar" style="width:100%"></i></div>
      <div class="label">${act.filter(t => pk[t.id]).length} of ${act.length} players locked in</div>
      ${board(ts, st, true)}</div></div>`;
}
function hResult(ts, st) {
  const fired = ts.filter(t => t.out && t.outRound === st.r);
  return `<div class="hostgrid"><div class="card">
      <span class="tag">After decision ${st.r + 1} of ${NR}</span>
      <h2 class="huge">${st.r + 1 < NR ? `Next Wall Street target: ${money(target(st.r + 1))}` : "The last decision is in."}</h2>
      ${fired.length ? `<div class="shock big">The board has replaced: ${fired.map(t => esc(t.name)).join(", ")}.</div>` : ""}
      <p class="big">${st.r + 1 < NR ? `The target rises ${money(P.targetStep)} every decision. Players below it move closer to being fired.` : "Every player's ending is decided. Time to see what the meters didn't show."}</p></div>
    <div class="card">${board(ts, st, false)}</div></div>`;
}
function hEnding(ts) {
  return `<div class="card"><span class="tag">The reveal</span>
    <h2 class="huge">Everyone watched the stock. Nobody saw the risk.</h2>
    ${scatterSvg(ts)}
    <table class="lb"><tr><th>Ending</th><th class="n">Players</th><th class="n">Avg stock</th><th class="n">Avg safety debt</th></tr>
      ${CONFIG.endings.map(e => { const g = ts.filter(t => t.ending === e.letter); if (!g.length) return "";
        const avg = f => g.reduce((a, t) => a + f(t), 0) / g.length;
        return `<tr><td><b>${e.letter}</b> · ${esc(e.title)}</td><td class="n">${g.length}</td><td class="n">${money(avg(t => t.stock))}</td><td class="n ${avg(t => t.safety) >= CONFIG.crashLine ? "down" : ""}">${Math.round(avg(t => t.safety))}</td></tr>`; }).join("")}</table></div>`;
}
function hDebrief(ts) {
  const lab = (r, k) => CONFIG.rounds[r].options[k].label;
  return `<div class="hostgrid"><div class="card"><span class="tag">Discuss</span>
      <ol class="prompts">${CONFIG.debriefPrompts.map(q => `<li>${esc(q)}</li>`).join("")}</ol></div>
    <div class="card"><h3>What the class chose vs. what Boeing did</h3>
      <table class="lb"><tr><th>Decision</th><th class="n">Wall St</th><th class="n">Middle</th><th class="n">Engineer</th></tr>
      ${CONFIG.rounds.map((rd, r) => { const c = { street: 0, middle: 0, engineer: 0 }; ts.forEach(t => { if (t.choices[r]) c[t.choices[r]]++; });
        return `<tr><td>${r + 1}. ${esc(rd.title)}</td>${KEYS.map(k => `<td class="n ${rd.boeing.choice === k ? "boeing" : ""}">${c[k]}</td>`).join("")}</tr>`; }).join("")}</table>
      <p class="note"><span class="boeing">Highlighted</span> = what Boeing did.</p></div></div>`;
}
function hostControls(st, ts) {
  const b = (id, txt, cls = "") => `<button class="btn ${cls}" id="${id}">${txt}</button>`;
  const p = st ? st.phase : "lobby";
  let c = "";
  if (p === "lobby") c = b("hStart", `Start decision 1 (${ts.length} players)`, "primary");
  if (p === "round") c = b("hPause", st.pausedLeft != null ? "Resume" : "Pause") + b("hAdd", "+15s") + b("hEnd", "End decision now", "primary");
  if (p === "result") c = st.r + 1 < NR ? b("hNext", `Start decision ${st.r + 2}`, "primary") : b("hReveal", "Reveal endings", "primary");
  if (p === "ending") c = b("hDebrief", "Open debrief", "primary");
  if (p === "debrief") c = b("hBack", "Back to reveal");
  return c + b("hReset", "Reset game", "ghost");
}
function renderHost() {
  const el = $("#main"); $("#sub").textContent = `Projector · game ${CODE}`;
  if (!SES || !SES.state) { el.innerHTML = `<div class="card"><h2>Starting game ${esc(CODE)}…</h2></div>`; return; }
  const st = SES.state, ts = teamsOf(SES);
  const views = { lobby: () => hLobby(ts), round: () => hRound(ts, st), result: () => hResult(ts, st), ending: () => hEnding(ts), debrief: () => hDebrief(ts) };
  el.innerHTML = views[st.phase]();
  $("#controls").innerHTML = hostControls(st, ts);
  const on = (id, fn) => { const x = document.getElementById(id); if (x) x.onclick = fn; };
  on("hStart", hostStartGame); on("hPause", hostPause); on("hAdd", () => hostAdd(15000));
  on("hEnd", () => B.update(SP, st.pausedLeft != null ? { "state/pausedLeft": 0 } : { "state/endsAt": B.now() }));
  on("hNext", () => hostStartRound(st.r + 1)); on("hReveal", hostReveal);
  on("hDebrief", () => hostPhase("debrief")); on("hBack", () => hostPhase("ending"));
  on("hReset", () => { if (confirm("Reset the game? All players go back to the join screen.")) hostCreate(); });
  el.querySelectorAll(".x").forEach(x => x.onclick = () => B.set(`${SP}/teams/${x.dataset.id}`, null));
}

function render() { (IS_HOST ? renderHost : renderGroup)(); tickTimers(); }

/* ---------------- boot ---------------- */
onConn = ok => { const d = $("#conn"); if (d) { d.className = "conn " + (ok ? "ok" : "bad"); d.textContent = B && B.mode === "demo" ? "Demo mode (this browser only)" : ok ? "Live" : "Reconnecting…"; } };
(async () => {
  document.body.classList.toggle("host", IS_HOST);
  try { B = await makeBackend(); }
  catch { $("#main").innerHTML = `<div class="card narrow"><h2>Can't reach the game server.</h2><p>Check the internet connection and reload.</p></div>`; return; }
  onConn(B.mode === "demo");
  if (IS_HOST) subscribe(qs.get("s") || CONFIG.sessionCode);
  else if (qs.get("s") && (() => { CODE = qs.get("s").toUpperCase(); return myId(); })()) subscribe(qs.get("s"));
  render();
})();
}
</script>
</body>
</html>
